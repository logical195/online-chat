.send-area{

/* =========================
ADMIN
========================= */

#adminPage{

}

.delete-button{
width:auto;
height:34px;

}

/* =========================
موبایل
========================= */

.card{
padding:22px 16px;

<script>

/* =================================
تنظیمات
================================= */

const SUPABASE_URL =
"https://phhdtmgubuwqoagjemjt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_tSAcYUIqP0OOE4vKscbKwA_MW8ExoLg";

/* =================================
ساخت اتصال
================================= */

let db = null;

try{

db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

}catch(error){

console.error(error);

alert(
"خطا در اتصال به سیستم چت. صفحه را دوباره باز کنید."
);

}

/* =================================
متغیرها
================================= */

let currentUsername =
localStorage.getItem("chat_username") || "";

let adminToken =
sessionStorage.getItem("admin_token") || "";

let realtimeChannel = null;

/* =================================
مخفی کردن صفحات
================================= */

function hidePages(){

document.getElementById("homePage")
.classList.add("hidden");

document.getElementById("registerPage")
.classList.add("hidden");

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("adminLoginPage")
.classList.add("hidden");

document.getElementById("chatPage")
.style.display="none";

document.getElementById("adminPage")
.style.display="none";

}

/* =================================
خانه
================================= */

function goHome(){

hidePages();

document.getElementById("homePage")
.classList.remove("hidden");

}

/* =================================
ساخت حساب
================================= */

function openRegister(){

hidePages();

document.getElementById("registerPage")
.classList.remove("hidden");

}

/* =================================
ورود
================================= */

function openLogin(){

hidePages();

document.getElementById("loginPage")
.classList.remove("hidden");

}

/* =================================
ورود ادمین
================================= */

function openAdminLogin(){

hidePages();

document.getElementById("adminLoginPage")
.classList.remove("hidden");

}

/* =================================
ساخت حساب کاربر
================================= */

async function registerUser(){

const username =
document.getElementById("registerUsername")
.value.trim();

const password =
document.getElementById("registerPassword")
.value;

const msg =
document.getElementById("registerMessage");

if(username.length < 2){

msg.textContent =
"❌ نام کاربری حداقل ۲ کاراکتر باشد.";

return;

}

if(password.length < 4){

msg.textContent =
"❌ رمز عبور حداقل ۴ کاراکتر باشد.";

return;

}

msg.textContent =
"⏳ در حال ساخت حساب...";

try{

const result =
await db.rpc(
"register_chat_user",
{
p_username:username,
p_password:password
}
);

if(result.error){

console.error(result.error);

msg.textContent =
"❌ خطا: " +
result.error.message;

return;

}

const data=result.data;

if(!data || data.success !== true){

msg.textContent =
"❌ " +
(data?.error || "ساخت حساب انجام نشد.");

return;

}

currentUsername =
data.username;

localStorage.setItem(
"chat_username",
currentUsername
);

msg.textContent =
"✅ حساب ساخته شد!";

setTimeout(
openChat,
600
);

}catch(error){

console.error(error);

msg.textContent =
"❌ خطای اتصال به سرور.";

}

}

/* =================================
ورود کاربر
================================= */

async function loginUser(){

const username =
document.getElementById("loginUsername")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

const msg =
document.getElementById("loginMessage");

if(!username || !password){

msg.textContent =
"❌ نام کاربری و رمز عبور را وارد کن.";

return;

}

msg.textContent =
"⏳ در حال ورود...";

try{

const result =
await db.rpc(
"login_chat_user",
{
p_username:username,
p_password:password
}
);

if(result.error){

console.error(result.error);

msg.textContent =
"❌ خطا: " +
result.error.message;

return;

}

const data=result.data;

if(!data || data.success !== true){

msg.textContent =
"❌ " +
(data?.error || "اطلاعات اشتباه است.");

return;

}

currentUsername =
data.username;

localStorage.setItem(
"chat_username",
currentUsername
);

openChat();

}catch(error){

console.error(error);

msg.textContent =
"❌ خطای اتصال به سرور.";

}

}

/* =================================
ورود ادمین
================================= */

async function adminLogin(){

const username =
document.getElementById("adminUsername")
.value.trim();

const password =
document.getElementById("adminPassword")
.value;

const msg =
document.getElementById("adminLoginMessage");

if(!username || !password){

msg.textContent =
"❌ اطلاعات را کامل وارد کن.";

return;

}

msg.textContent =
"⏳ در حال بررسی...";

try{

const result =
await db.rpc(
"admin_login",
{
p_username:username,
p_password:password
}
);

if(result.error){

console.error(result.error);

msg.textContent =
"❌ خطا: " +
result.error.message;

return;

}

const data=result.data;

if(!data || data.success !== true){

msg.textContent =
"❌ " +
(data?.error || "اطلاعات ادمین اشتباه است.");

return;

}

adminToken =
data.token;

sessionStorage.setItem(
"admin_token",
adminToken
);

openAdmin();

}catch(error){

console.error(error);

msg.textContent =
"❌ خطای اتصال به سرور.";

}

}

/* =================================
باز کردن چت
================================= */

async function openChat(){

hidePages();

document.getElementById("chatPage")
.style.display="flex";

document.getElementById("chatUsername")
.textContent =
"👤 " + currentUsername;

await loadMessages();

startRealtime();

}

/* =================================
دریافت پیام‌ها
================================= */

async function loadMessages(){

const box =
document.getElementById("messages");

box.innerHTML =
'<div class="empty">⏳ در حال دریافت پیام‌ها...</div>';

try{

const result =
await db
.from("messages")
.select(
"id,username,message,created_at"
)
.order(
"created_at",
{
ascending:true
}
)
.limit(20);

if(result.error){

console.error(result.error);

box.innerHTML =
'<div class="empty">❌ دریافت پیام‌ها ناموفق بود.</div>';

return;

}

box.innerHTML="";

if(!result.data || result.data.length===0){

box.innerHTML =
'<div class="empty">هنوز پیامی وجود ندارد 👋</div>';

return;

}

result.data.forEach(
addMessage
);

scrollBottom();

}catch(error){

console.error(error);

box.innerHTML =
'<div class="empty">❌ خطا در دریافت پیام‌ها.</div>';

}

}

/* =================================
نمایش پیام
================================= */

function addMessage(msg){

const box =
document.getElementById("messages");

if(box.querySelector(
'[data-id="'+msg.id+'"]'
)){

return;

}

const item =
document.createElement("div");

item.className="message";

item.dataset.id=msg.id;

const user =
document.createElement("div");

user.className="message-user";

user.textContent =
"👤 " + msg.username;

const text =
document.createElement("div");

text.className="message-text";

text.textContent =
msg.message;

const time =
document.createElement("div");

time.className="message-time";

time.textContent =
formatTime(msg.created_at);

item.appendChild(user);

item.appendChild(text);

item.appendChild(time);

box.appendChild(item);

limitMessages();

}

/* =================================
حداکثر ۲۰ پیام روی صفحه
================================= */

function limitMessages(){

const box =
document.getElementById("messages");

const items =
box.querySelectorAll(".message");

while(items.length > 20){

items[0].remove();

}

}

/* =================================
ارسال پیام
================================= */

async function sendMessage(){

const input =
document.getElementById("messageInput");

const text =
input.value.trim();

if(!text){

return;

}

if(!currentUsername){

alert("ابتدا وارد حساب شوید.");

return;

}

input.disabled=true;

try{

const result =
await db
.from("messages")
.insert({

username:currentUsername,

message:text

});

if(result.error){

console.error(result.error);

alert(
"❌ ارسال پیام ناموفق بود:\n" +
result.error.message
);

return;

}

input.value="";

}catch(error){

console.error(error);

alert(
"❌ خطا در ارسال پیام."
);

}finally{

input.disabled=false;

input.focus();

}

}

/* =================================
Enter
================================= */

document
.getElementById("messageInput")
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

event.preventDefault();

sendMessage();

}

}
);

/* =================================
Realtime
================================= */

function startRealtime(){

if(realtimeChannel){

db.removeChannel(
realtimeChannel
);

}

realtimeChannel =
db
.channel("chat-room-mobile")

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages"
},
function(payload){

addMessage(
payload.new
);

scrollBottom();

}
)

.on(
"postgres_changes",
{
event:"DELETE",
schema:"public",
table:"messages"
},
function(payload){

const id =
payload.old?.id;

if(id){

const item =
document.querySelector(
'[data-id="'+id+'"]'
);

if(item){

item.remove();

}

}

}
)

.subscribe();

}

/* =================================
اسکرول
================================= */

function scrollBottom(){

const box =
document.getElementById("messages");

setTimeout(
function(){

box.scrollTop =
box.scrollHeight;

},
50
);

}

/* =================================
ساعت
================================= */

function formatTime(date){

try{

return new Date(date)
.toLocaleTimeString(
"fa-IR",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch(e){

return "";

}

}

/* =================================
خروج کاربر
================================= */

function logoutUser(){

currentUsername="";

localStorage.removeItem(
"chat_username"
);

if(realtimeChannel){

db.removeChannel(
realtimeChannel
);

realtimeChannel=null;

}

goHome();

}

/* =================================
باز کردن ادمین
================================= */

async function openAdmin(){

hidePages();

document.getElementById("adminPage")
.style.display="block";

await loadAdminMessages();

}

/* =================================
پیام‌های ادمین
================================= */

async function loadAdminMessages(){

const box =
document.getElementById("adminMessages");

box.innerHTML =
'<div class="empty">⏳ در حال دریافت...</div>';

try{

const result =
await db
.from("messages")
.select(
"id,username,message,created_at"
)
.order(
"created_at",
{
ascending:false
}
)
.limit(20);

if(result.error){

console.error(result.error);

box.innerHTML =
'<div class="empty">❌ دریافت پیام‌ها ناموفق بود.</div>';

return;

}

box.innerHTML="";

if(!result.data || result.data.length===0){

box.innerHTML =
'<div class="empty">چتی وجود ندارد.</div>';

return;

}

result.data.forEach(
function(msg){

const item =
document.createElement("div");

item.className="admin-message";

const top =
document.createElement("div");

top.className="admin-top";

const user =
document.createElement("div");

user.className="admin-username";

user.textContent =
"👤 " + msg.username;

const deleteBtn =
document.createElement("button");

deleteBtn.className="delete-button";

deleteBtn.textContent="🗑️ حذف";

deleteBtn.onclick =
function(){

deleteOneMessage(
msg.id
);

};

top.appendChild(user);

top.appendChild(deleteBtn);

const text =
document.createElement("div");

text.className="message-text";

text.textContent =
msg.message;

const time =
document.createElement("div");

time.className="message-time";

time.textContent =
formatTime(msg.created_at);

item.appendChild(top);

item.appendChild(text);

item.appendChild(time);

box.appendChild(item);

}
);

}catch(error){

console.error(error);

box.innerHTML =
'<div class="empty">❌ خطا در دریافت اطلاعات.</div>';

}

}

/* =================================
حذف یک پیام
================================= */

async function deleteOneMessage(id){

if(!adminToken){

alert(
"دسترسی ادمین معتبر نیست."
);

return;

}

if(!confirm(
"این پیام حذف شود؟"
)){

return;

}

try{

const result =
await db.rpc(
"admin_delete_message",
{
p_token:adminToken,
p_message_id:id
}
);

if(result.error){

alert(
"❌ " +
result.error.message
);

return;

}

if(!result.data?.success){

alert(
"❌ " +
(
result.data?.error ||
"حذف انجام نشد."
)
);

return;

}

await loadAdminMessages();

}catch(error){

console.error(error);

alert(
"❌ خطا در حذف پیام."
);

}

}
