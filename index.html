<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چت آنلاین</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Tahoma, Arial, sans-serif;
background: linear-gradient(135deg, #111827, #1e3a8a);
color: white;
min-height: 100vh;
}

button,
input {
font-family: inherit;
}

.screen {
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}

.hidden {
display: none !important;
}

.box {
width: 100%;
max-width: 420px;
background: rgba(17, 24, 39, 0.95);
border-radius: 24px;
padding: 28px;
box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

h1,
h2 {
text-align: center;
margin-top: 0;
}

.subtitle {
text-align: center;
color: #cbd5e1;
margin-bottom: 25px;
}

input {
width: 100%;
padding: 15px;
margin: 8px 0;
border: 1px solid #475569;
border-radius: 14px;
background: #0f172a;
color: white;
font-size: 16px;
outline: none;
}

input:focus {
border-color: #60a5fa;
}

button {
width: 100%;
border: 0;
padding: 15px;
margin-top: 10px;
border-radius: 14px;
background: #2563eb;
color: white;
font-size: 16px;
font-weight: bold;
cursor: pointer;
}

button:hover {
background: #1d4ed8;
}

.secondary {
background: #334155;
}

.secondary:hover {
background: #475569;
}

.danger {
background: #dc2626;
}

.danger:hover {
background: #b91c1c;
}

.success {
background: #16a34a;
}

.message {
text-align: center;
margin-top: 15px;
min-height: 24px;
color: #fbbf24;
}

/* CHAT */

#chatScreen {
display: none;
min-height: 100vh;
flex-direction: column;
}

.chat-header {
background: rgba(15, 23, 42, 0.98);
padding: 15px;
display: flex;
justify-content: space-between;
align-items: center;
gap: 10px;
position: sticky;
top: 0;
z-index: 10;
}

.chat-title {
font-size: 18px;
font-weight: bold;
}

.username-label {
font-size: 13px;
color: #94a3b8;
margin-top: 4px;
}

.logout-btn {
width: auto;
margin: 0;
padding: 9px 14px;
font-size: 13px;
background: #475569;
}

#messages {
flex: 1;
width: 100%;
max-width: 800px;
margin: auto;
padding: 20px 15px 100px;
overflow-y: auto;
}

.message-item {
background: rgba(30, 41, 59, 0.9);
border-radius: 16px;
padding: 12px 15px;
margin-bottom: 10px;
word-wrap: break-word;
}

.message-user {
color: #60a5fa;
font-weight: bold;
margin-bottom: 5px;
}

.message-text {
color: #f8fafc;
line-height: 1.7;
}

.message-time {
color: #64748b;
font-size: 11px;
margin-top: 5px;
}

.send-area {
position: fixed;
bottom: 0;
left: 0;
right: 0;
background: rgba(15, 23, 42, 0.98);
padding: 10px;
z-index: 20;
}

.send-box {
max-width: 800px;
margin: auto;
display: flex;
gap: 8px;
}

.send-box input {
margin: 0;
flex: 1;
}

.send-box button {
width: auto;
margin: 0;
padding: 0 20px;
}

/* ADMIN */

#adminScreen {
display: none;
min-height: 100vh;
padding: 20px;
}

.admin-container {
width: 100%;
max-width: 900px;
margin: auto;
}

.admin-header {
background: rgba(15,23,42,0.95);
padding: 20px;
border-radius: 20px;
margin-bottom: 15px;
}

.admin-actions {
display: flex;
gap: 10px;
flex-wrap: wrap;
}

.admin-actions button {
flex: 1;
min-width: 150px;
}

.admin-message {
background: rgba(15,23,42,0.95);
border-radius: 16px;
padding: 15px;
margin-bottom: 10px;
}

.admin-message-top {
display: flex;
justify-content: space-between;
gap: 10px;
align-items: center;
margin-bottom: 8px;
}

.admin-message-user {
color: #60a5fa;
font-weight: bold;
}

.delete-one {
width: auto;
margin: 0;
padding: 7px 12px;
font-size: 12px;
}

.empty {
text-align: center;
color: #94a3b8;
padding: 40px;
}

@media (max-width: 600px) {
.box {
padding: 22px;
}

.chat-header {
padding: 12px;
}

.chat-title {
font-size: 16px;
}

.send-box button {
padding: 0 15px;
}
}
</style>
</head>

<body>

<!-- صفحه اصلی -->
<div id="homeScreen" class="screen">
<div class="box">
<h1>💬 چت آنلاین</h1>
<div class="subtitle">
به چت آنلاین خوش آمدید
</div>

<button onclick="showRegister()">
📝 ساخت حساب
</button>

<button onclick="showLogin()">
🔐 ورود به حساب
</button>

<button class="secondary" onclick="showAdminLogin()">
👑 ورود ادمین
</button>

<div id="homeMessage" class="message"></div>
</div>
</div>

<!-- ساخت حساب -->
<div id="registerScreen" class="screen hidden">
<div class="box">
<h2>📝 ساخت حساب</h2>

<input
id="registerUsername"
type="text"
placeholder="نام کاربری"
maxlength="30"
autocomplete="username"
>

<input
id="registerPassword"
type="password"
placeholder="رمز عبور"
autocomplete="new-password"
>

<button onclick="registerUser()">
ساخت حساب
</button>

<button class="secondary" onclick="showHome()">
بازگشت
</button>

<div id="registerMessage" class="message"></div>
</div>
</div>

<!-- ورود حساب -->
<div id="loginScreen" class="screen hidden">
<div class="box">
<h2>🔐 ورود به حساب</h2>

<input
id="loginUsername"
type="text"
placeholder="نام کاربری"
autocomplete="username"
>

<input
id="loginPassword"
type="password"
placeholder="رمز عبور"
autocomplete="current-password"
>

<button onclick="loginUser()">
ورود
</button>

<button class="secondary" onclick="showHome()">
بازگشت
</button>

<div id="loginMessage" class="message"></div>
</div>
</div>

<!-- ورود ادمین -->
<div id="adminLoginScreen" class="screen hidden">
<div class="box">
<h2>👑 ورود ادمین</h2>

<input
id="adminUsername"
type="text"
placeholder="نام کاربری ادمین"
autocomplete="username"
>

<input
id="adminPassword"
type="password"
placeholder="رمز عبور ادمین"
autocomplete="current-password"
>

<button onclick="adminLogin()">
ورود به پنل
</button>

<button class="secondary" onclick="showHome()">
بازگشت
</button>

<div id="adminLoginMessage" class="message"></div>
</div>
</div>

<!-- صفحه چت -->
<div id="chatScreen">

<div class="chat-header">
<div>
<div class="chat-title">
💬 چت آنلاین
</div>

<div id="currentUsername" class="username-label">
...
</div>
</div>

<button class="logout-btn" onclick="logoutUser()">
خروج
</button>
</div>

<div id="messages"></div>

<div class="send-area">
<div class="send-box">
<input
id="messageInput"
type="text"
placeholder="پیامت رو بنویس..."
maxlength="1000"
autocomplete="off"
>

<button onclick="sendMessage()">
ارسال
</button>
</div>
</div>

</div>

<!-- پنل ادمین -->
<div id="adminScreen">

<div class="admin-container">

<div class="admin-header">
<h2>👑 پنل مدیریت چت</h2>

<div class="admin-actions">

<button
class="danger"
onclick="deleteAllMessages()"
>
🗑️ حذف کل چت
</button>

<button
class="secondary"
onclick="loadAdminMessages()"
>
🔄 بروزرسانی
</button>

<button
class="secondary"
onclick="logoutAdmin()"
>
خروج
</button>

</div>
</div>

<div id="adminMessages"></div>

</div>

</div>

<script>

/* ================================
تنظیمات Supabase
================================= */

const SUPABASE_URL =
"https://phhdtmgubuwqoagjemjt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_tSAcYUIqP0OOE4vKscbKwA_MW8ExoLg";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

/* ================================
متغیرها
================================= */

let currentUsername =
localStorage.getItem("chat_username") || "";

let adminToken =
sessionStorage.getItem("admin_token") || "";

let realtimeChannel = null;

/* ================================
مدیریت صفحات
================================= */

function hideAllScreens() {

document.getElementById("homeScreen")
.classList.add("hidden");

document.getElementById("registerScreen")
.classList.add("hidden");

document.getElementById("loginScreen")
.classList.add("hidden");

document.getElementById("adminLoginScreen")
.classList.add("hidden");

document.getElementById("chatScreen")
.style.display = "none";

document.getElementById("adminScreen")
.style.display = "none";
}

function showHome() {

hideAllScreens();

document.getElementById("homeScreen")
.classList.remove("hidden");
}

function showRegister() {

hideAllScreens();

document.getElementById("registerScreen")
.classList.remove("hidden");

document.getElementById("registerMessage")
.textContent = "";
}

function showLogin() {

hideAllScreens();

document.getElementById("loginScreen")
.classList.remove("hidden");

document.getElementById("loginMessage")
.textContent = "";
}

function showAdminLogin() {

hideAllScreens();

document.getElementById("adminLoginScreen")
.classList.remove("hidden");

document.getElementById("adminLoginMessage")
.textContent = "";
}

/* ================================
ساخت حساب
================================= */

async function registerUser() {

const username =
document.getElementById("registerUsername")
.value.trim();

const password =
document.getElementById("registerPassword")
.value;

const message =
document.getElementById("registerMessage");

message.textContent = "⏳ در حال ساخت حساب...";

if (!username || !password) {

message.textContent =
"❌ نام کاربری و رمز عبور را وارد کن.";

return;
}

try {

const { data, error } =
await db.rpc("register_chat_user", {
p_username: username,
p_password: password
});

if (error) {

console.error(error);

message.textContent =
"❌ خطا در ارتباط با سرور: " +
error.message;

return;
}

if (!data || !data.success) {

message.textContent =
"❌ " +
(data?.error || "ساخت حساب ناموفق بود.");

return;
}

currentUsername = data.username;

localStorage.setItem(
"chat_username",
currentUsername
);

message.textContent =
"✅ حساب با موفقیت ساخته شد.";

setTimeout(() => {

openChat();

}, 700);

} catch (err) {

console.error(err);

message.textContent =
"❌ یک خطای غیرمنتظره رخ داد.";
}
}

/* ================================
ورود کاربر
================================= */

async function loginUser() {

const username =
document.getElementById("loginUsername")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

const message =
document.getElementById("loginMessage");

message.textContent = "⏳ در حال ورود...";

if (!username || !password) {

message.textContent =
"❌ نام کاربری و رمز عبور را وارد کن.";

return;
}

try {

const { data, error } =
await db.rpc("login_chat_user", {
p_username: username,
p_password: password
});

if (error) {

console.error(error);

message.textContent =
"❌ خطا در ارتباط با سرور: " +
error.message;

return;
}

if (!data || !data.success) {

message.textContent =
"❌ " +
(data?.error || "نام کاربری یا رمز عبور اشتباه است.");

return;
}

currentUsername = data.username;

localStorage.setItem(
"chat_username",
currentUsername
);

openChat();

} catch (err) {

console.error(err);

message.textContent =
"❌ یک خطای غیرمنتظره رخ داد.";
}
}

/* ================================
ورود ادمین
================================= */

async function adminLogin() {

const username =
document.getElementById("adminUsername")
.value.trim();

const password =
document.getElementById("adminPassword")
.value;

const message =
document.getElementById("adminLoginMessage");

message.textContent = "⏳ در حال بررسی...";

if (!username || !password) {

message.textContent =
"❌ اطلاعات را کامل وارد کن.";

return;
}

try {

const { data, error } =
await db.rpc("admin_login", {
p_username: username,
p_password: password
});

if (error) {

console.error(error);

message.textContent =
"❌ خطا: " +
error.message;

return;
}

if (!data || !data.success) {

message.textContent =
"❌ " +
(data?.error || "اطلاعات ادمین اشتباه است.");

return;
}

adminToken = data.token;

sessionStorage.setItem(
"admin_token",
adminToken
);

openAdminPanel();

} catch (err) {

console.error(err);

message.textContent =
"❌ خطای غیرمنتظره.";
}
}

/* ================================
باز کردن چت
================================= */

async function openChat() {

hideAllScreens();

document.getElementById("chatScreen")
.style.display = "flex";

document.getElementById("currentUsername")
.textContent =
"👤 " + currentUsername;

await loadMessages();

startRealtime();

await cleanupOldMessages();
}

/* ================================
دریافت پیام‌ها
================================= */

async function loadMessages() {

const container =
document.getElementById("messages");

container.innerHTML =
'<div class="empty">⏳ در حال دریافت پیام‌ها...</div>';

const { data, error } =
await db
.from("messages")
.select("id,username,message,created_at")
.order("created_at", {
ascending: true
})
.limit(20);

if (error) {

console.error(error);

container.innerHTML =
'<div class="empty">❌ دریافت پیام‌ها ناموفق بود.</div>';

return;
}

container.innerHTML = "";

if (!data || data.length === 0) {

container.innerHTML =
'<div class="empty">هنوز پیامی وجود ندارد 👋</div>';

return;
}

data.forEach(addMessage);

scrollMessagesToBottom();
}

/* ================================
نمایش پیام
================================= */

function addMessage(msg) {

const container =
document.getElementById("messages");

if (!container) return;

if (
container.querySelector(
[data-message-id="${msg.id}"]`
)
) {
return;
}

const item =
document.createElement("div");

item.className = "message-item";

item.dataset.messageId = msg.id;

const user =
document.createElement("div");

user.className = "message-user";

user.textContent =
"👤 " + msg.username;

const text =
document.createElement("div");

text.className = "message-text";

text.textContent =
msg.message;

const time =
document.createElement("div");

time.className = "message-time";

time.textContent =
formatTime(msg.created_at);

item.appendChild(user);
item.appendChild(text);
item.appendChild(time);

container.appendChild(item);

limitVisibleMessages();
}

/* ================================
محدود کردن پیام‌های نمایشی
================================= */

function limitVisibleMessages() {

const container =
document.getElementById("messages");

const items =
container.querySelectorAll(".message-item");

if (items.length <= 20) return;

const extra =
items.length - 20;

for (let i = 0; i < extra; i++) {

items[i].remove();
}
}

/* ================================
ارسال پیام
================================= */

async function sendMessage() {

const input =
document.getElementById("messageInput");

const text =
input.value.trim();

if (!text) return;

if (!currentUsername) {

alert("ابتدا وارد حساب شو.");

return;
}

input.disabled = true;

const { error } =
await db
.from("messages")
.insert({
username: currentUsername,
message: text
});

input.disabled = false;

if (error) {

console.error(error);

alert(
"❌ ارسال پیام ناموفق بود:\n" +
error.message
);

return;
}

input.value = "";
input.focus();
}

/* ================================
ارسال با Enter
================================= */

document
.getElementById("messageInput")
.addEventListener("keydown", function(event) {

if (event.key === "Enter") {

event.preventDefault();

sendMessage();
}
});

/* ================================
Realtime
================================= */

function startRealtime() {

if (realtimeChannel) {

db.removeChannel(realtimeChannel);

realtimeChannel = null;
}

realtimeChannel =
db
.channel("public-chat-room")

.on(
"postgres_changes",
{
event: "INSERT",
schema: "public",
table: "messages"
},
payload => {

addMessage(payload.new);

scrollMessagesToBottom();
}
)

.on(
"postgres_changes",
{
event: "DELETE",
schema: "public",
table: "messages"
},
payload => {

const id =
payload.old?.id;

if (!id) {

loadMessages();

return;
}

const item =
document.querySelector(
[data-message-id="${id}"]`
);

if (item) {

item.remove();
}
}
)

.subscribe();
}

/* ================================
اسکرول پایین
================================= */

function scrollMessagesToBottom() {

const container =
document.getElementById("messages");

if (!container) return;

setTimeout(() => {

container.scrollTop =
container.scrollHeight;

}, 50);
}

/* ================================
فرمت ساعت
================================= */

function formatTime(dateString) {

try {

const date =
new Date(dateString);

return date.toLocaleString(
"fa-IR",
{
hour: "2-digit",
minute: "2-digit"
}
);

} catch {

return "";
}
}

/* ================================
خروج کاربر
================================= */

function logoutUser() {

currentUsername = "";

localStorage.removeItem(
"chat_username"
);

if (realtimeChannel) {

db.removeChannel(realtimeChannel);

realtimeChannel = null;
}

showHome();
}

/* ================================
پنل ادمین
================================= */

async function openAdminPanel() {

hideAllScreens();

document.getElementById("adminScreen")
.style.display = "block";

await loadAdminMessages();
}

/* ================================
دریافت پیام‌ها برای ادمین
================================= */

async function loadAdminMessages() {

const container =
document.getElementById("adminMessages");

container.innerHTML =
'<div class="empty">⏳ در حال دریافت پیام‌ها...</div>';

const { data, error } =
await db
.from("messages")
.select("id,username,message,created_at")
.order("created_at", {
ascending: false
})
.limit(20);

if (error) {

console.error(error);

container.innerHTML =
'<div class="empty">❌ دریافت پیام‌ها ناموفق بود.</div>';

return;
}

container.innerHTML = "";

if (!data || data.length === 0) {

container.innerHTML =
'<div class="empty">چتی وجود ندارد.</div>';

return;
}

data.forEach(msg => {

const item =
document.createElement("div");

item.className =
"admin-message";

item.dataset.messageId =
msg.id;

const top =
document.createElement("div");

top.className =
"admin-message-top";

const user =
document.createElement("div");

user.className =
"admin-message-user";

user.textContent =
"👤 " + msg.username;

const deleteButton =
document.createElement("button");

deleteButton.className =
"delete-one danger";

deleteButton.textContent =
"🗑️ حذف";

deleteButton.onclick =
() => deleteOneMessage(msg.id);

top.appendChild(user);
top.appendChild(deleteButton);

const text =
document.createElement("div");

text.className =
"message-text";

text.textContent =
msg.message;

const time =
document.createElement("div");

time.className =
"message-time";

time.textContent =
formatTime(msg.created_at);

item.appendChild(top);
item.appendChild(text);
item.appendChild(time);

container.appendChild(item);
});
}

/* ================================
حذف یک پیام
================================= */

async function deleteOneMessage(messageId) {

if (!adminToken) {

alert("دسترسی ادمین معتبر نیست.");

return;
}

const confirmed =
confirm("این پیام حذف شود؟");

if (!confirmed) return;

const { data, error } =
await db.rpc(
"admin_delete_message",
{
p_token: adminToken,
p_message_id: messageId
}
);

if (error) {

console.error(error);

alert(
"❌ خطا در حذف پیام:\n" +
error.message
);

return;
}

if (!data || !data.success) {

alert(
"❌ " +
(data?.error || "حذف پیام انجام نشد.")
);

return;
}

await loadAdminMessages();
}

/* ================================
حذف کل چت
================================= */

async function deleteAllMessages() {

if (!adminToken) {

alert("دسترسی ادمین معتبر نیست.");

return;
}

const confirmed =
confirm(
"⚠️ مطمئنی می‌خواهی تمام پیام‌های چت حذف شوند؟"
);

if (!confirmed) return;

const { data, error } =
await db.rpc(
"admin_delete_all_messages",
{
p_token: adminToken
}
);

if (error) {

console.error(error);

alert(
"❌ خطا:\n" +
error.message
);

return;
}

if (!data || !data.success) {

alert(
"❌ " +
(data?.error || "حذف انجام نشد.")
);

return;
}

await loadAdminMessages();

alert("✅ کل چت پاک شد.");
}

/* ================================
خروج ادمین
================================= */

function logoutAdmin() {

adminToken = "";

sessionStorage.removeItem(
"admin_token"
);

showHome();
}

/* ================================
پاک کردن پیام‌های قدیمی‌تر از ۲۴ ساعت
================================= */

async function cleanupOldMessages() {

try {

const { error } =
await db.rpc(
"cleanup_old_chat_messages"
);

if (error) {

console.warn(
"Cleanup error:",
error
);
}

} catch (err) {

console.warn(
"Cleanup exception:",
err
);
}
}

/* ================================
اجرای پاکسازی هر ۲۴ ساعت
================================= */

setInterval(
cleanupOldMessages,
24 * 60 * 60 * 1000
);

/* ================================
شروع برنامه
================================= */

window.addEventListener(
"load",
