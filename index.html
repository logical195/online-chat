<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چت آنلاین</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#10131a;
color:#fff;
height:100vh;
overflow:hidden;
}

.app{
width:100%;
max-width:700px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
background:#171b24;
}

.header{
padding:16px;
background:#202633;
border-bottom:1px solid #303746;
display:flex;
justify-content:space-between;
align-items:center;
}

.title{
font-size:20px;
font-weight:bold;
}

.status{
font-size:12px;
color:#69e58a;
}

.messages{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
background:#252c3a;
border-radius:14px;
padding:10px 13px;
max-width:85%;
}

.username{
color:#66aaff;
font-size:13px;
font-weight:bold;
margin-bottom:5px;
}

.text{
font-size:15px;
line-height:1.6;
word-break:break-word;
}

.time{
color:#8992a3;
font-size:10px;
margin-top:5px;
}

.empty{
margin:auto;
color:#8992a3;
}

.input-area{
padding:12px;
background:#202633;
border-top:1px solid #303746;
}

.form{
display:flex;
gap:8px;
}

.input{
flex:1;
border:0;
outline:0;
border-radius:12px;
padding:13px;
background:#2b3241;
color:#fff;
font-size:15px;
}

.send,.join{
border:0;
border-radius:12px;
background:#3478f6;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.send{
padding:0 20px;
}

.login{
position:fixed;
inset:0;
z-index:100;
background:#10131a;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:400px;
background:#202633;
padding:25px;
border-radius:20px;
text-align:center;
}

.login-box h1{
margin-top:0;
}

.login-box p{
color:#9ca5b5;
}

.name-input{
width:100%;
padding:14px;
border:0;
outline:0;
border-radius:12px;
background:#2b3241;
color:#fff;
font-size:16px;
margin:15px 0;
}

.join{
width:100%;
padding:14px;
font-size:16px;
}

.error{
color:#ff6868;
font-size:13px;
margin-top:10px;
}

@media(max-width:500px){
.message{max-width:90%}
.send{padding:0 15px}
}
</style>
</head>

<body>

<!-- صفحه ورود -->
<div class="login" id="login">

<div class="login-box">

<h1>💬 چت آنلاین</h1>

<p>برای ورود یک اسم انتخاب کن</p>

<input
id="nameInput"
class="name-input"
type="text"
maxlength="30"
placeholder="مثلاً پاتریک"
autocomplete="off"
>

<button
id="joinBtn"
class="join"
type="button">
ورود به چت 🚀
</button>

<div id="loginError" class="error"></div>

</div>

</div>

<!-- خود چت -->
<div class="app">

<div class="header">
<div class="title">💬 چت آنلاین</div>
<div id="status" class="status">در حال اتصال...</div>
</div>

<div id="messages" class="messages">

<div id="empty" class="empty">
هنوز پیامی ارسال نشده 👋
</div>

</div>

<div class="input-area">

<form id="messageForm" class="form">

<input
id="messageInput"
class="input"
type="text"
maxlength="500"
placeholder="پیامت رو بنویس..."
autocomplete="off"
>

<button class="send" type="submit">
ارسال
</button>

</form>

</div>

</div>

<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://phhdtmgubuwqoagjemjt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_tSAcYUIqP0OOE4vKscbKwA_MW8ExoLg";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

/* =========================
عناصر صفحه
========================= */

const login = document.getElementById("login");
const nameInput = document.getElementById("nameInput");
const joinBtn = document.getElementById("joinBtn");
const loginError = document.getElementById("loginError");

const messagesBox = document.getElementById("messages");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");
const status = document.getElementById("status");

let username =
localStorage.getItem("chat_username");

/* =========================
ورود به چت
========================= */

function joinChat(){

const name =
nameInput.value.trim();

if(name.length < 2){

loginError.textContent =
"لطفاً حداقل ۲ حرف وارد کن.";

return;
}

username = name;

localStorage.setItem(
"chat_username",
username
);

login.style.display = "none";

messageInput.focus();
}

/* دکمه ورود */

joinBtn.onclick = joinChat;

/* کلید Enter */

nameInput.onkeydown = function(event){

if(event.key === "Enter"){
joinChat();
}

};

/* اگر قبلاً اسم ذخیره شده */

if(username){

login.style.display = "none";

}

/* =========================
ساعت
========================= */

function formatTime(date){

return new Date(date)
.toLocaleTimeString("fa-IR",{
hour:"2-digit",
minute:"2-digit"
});

}

/* =========================
نمایش پیام
========================= */

function addMessage(message){

if(!message || !message.id){
return;
}

if(
document.querySelector(
'[data-message-id="' +
message.id +
'"]'
)
){
return;
}

const empty =
document.getElementById("empty");

if(empty){
empty.remove();
}

const box =
document.createElement("div");

box.className = "message";

box.dataset.messageId =
message.id;

const user =
document.createElement("div");

user.className = "username";

user.textContent =
message.username;

const text =
document.createElement("div");

text.className = "text";

text.textContent =
message.message;

const time =
document.createElement("div");

time.className = "time";

time.textContent =
formatTime(message.created_at);

box.appendChild(user);
box.appendChild(text);
box.appendChild(time);

messagesBox.appendChild(box);

messagesBox.scrollTop =
messagesBox.scrollHeight;

}

/* =========================
دریافت پیام‌های قبلی
========================= */

async function loadMessages(){

const result =
await db
.from("messages")
.select(
"id,username,message,created_at"
)
.order(
"created_at",
{ascending:true}
)
.limit(100);

if(result.error){

console.error(result.error);

status.textContent =
"🔴 خطای اتصال";

return;
}

result.data.forEach(addMessage);

status.textContent =
"🟢 آنلاین";

}

/* =========================
ارسال پیام
========================= */

messageForm.onsubmit =
async function(event){

event.preventDefault();

const text =
messageInput.value.trim();

if(!text){
return;
}

if(!username){

login.style.display =
"flex";

return;
}

messageInput.disabled = true;

const result =
await db
.from("messages")
.insert({
username:username,
message:text
});

if(result.error){

console.error(result.error);

alert(
"❌ پیام ارسال نشد"
);

}else{

messageInput.value = "";

}

messageInput.disabled = false;

messageInput.focus();

};

/* =========================
پیام‌های لحظه‌ای
========================= */

db
.channel("chat-room")
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages"
},
function(payload){

addMessage(payload.new);

}
)
.subscribe(function(state){

if(state === "SUBSCRIBED"){

status.textContent =
"🟢 آنلاین";

}

});

/* =========================
شروع
========================= */

loadMessages();

</script>

</body>
</html>
