<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>چت آنلاین</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:#0f131a;color:#fff}
body{overflow:hidden}
button,input{font-family:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}

.screen{
width:100%;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}

.card{
width:100%;
max-width:420px;
background:#191f29;
border:1px solid #2b3442;
border-radius:22px;
padding:24px 18px;
box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.logo{
width:72px;
height:72px;
margin:0 auto 16px;
border-radius:21px;
background:#287cff;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
}

h1{text-align:center;margin:0 0 8px;font-size:24px}
.sub{text-align:center;color:#929cac;font-size:13px;margin-bottom:22px}

.btn{
width:100%;
height:52px;
border-radius:13px;
margin-top:10px;
font-size:16px;
font-weight:bold;
color:#fff;
background:#287cff;
}

.btn:active{transform:scale(.98)}
.btn.secondary{background:#28313e}
.btn.admin{background:#673ab7}

.title{
text-align:center;
font-size:21px;
font-weight:bold;
margin-bottom:18px;
}

.input{
width:100%;
height:52px;
margin-bottom:11px;
border-radius:13px;
border:1px solid #374252;
background:#10151c;
color:#fff;
padding:0 14px;
font-size:16px;
outline:none;
}

.input:focus{border-color:#287cff}

.notice{
display:none;
margin-top:12px;
padding:11px;
border-radius:11px;
font-size:13px;
line-height:1.7;
text-align:center;
}

.notice.show{display:block}
.notice.error{background:#3b2027;color:#ff9fab}
.notice.ok{background:#193829;color:#8bf0b3}

#chatScreen{
width:100%;
height:100vh;
display:flex;
flex-direction:column;
background:#0f131a;
}

.header{
height:64px;
flex-shrink:0;
background:#191f29;
border-bottom:1px solid #2b3442;
display:flex;
align-items:center;
justify-content:space-between;
padding:9px 12px;
}

.headerTitle{font-weight:bold;font-size:16px}
.status{color:#64e49b;font-size:11px;margin-top:3px}

.smallBtn{
background:#28313e;
color:#fff;
border-radius:9px;
padding:9px 11px;
font-size:12px;
}

.messages{
flex:1;
overflow-y:auto;
padding:13px;
display:flex;
flex-direction:column;
gap:8px;
}

.empty{
margin:auto;
color:#818b9b;
text-align:center;
}

.messageBubble{
max-width:88%;
align-self:flex-start;
background:#1c2531;
border:1px solid #2c3746;
border-radius:15px;
padding:8px 11px;
}

.messageBubble.mine{
align-self:flex-end;
background:#225caf;
border-color:#3472cc;
}

.user{
font-size:11px;
font-weight:bold;
color:#76aaff;
margin-bottom:4px;
}

.mine .user{color:#d9e8ff}

.messageText{
font-size:14px;
line-height:1.65;
word-break:break-word;
}

.time{
font-size:9px;
color:#8993a2;
margin-top:4px;
}

.mine .time{color:#d2def2}

.inputArea{
flex-shrink:0;
display:flex;
gap:7px;
padding:9px;
background:#191f29;
border-top:1px solid #2b3442;
}

.chatInput{
flex:1;
min-width:0;
height:48px;
border-radius:13px;
border:1px solid #374252;
background:#10151c;
color:#fff;
padding:0 12px;
font-size:15px;
outline:none;
}

.send{
width:54px;
height:48px;
border-radius:13px;
background:#287cff;
color:#fff;
font-size:20px;
}

#adminScreen{
width:100%;
height:100vh;
overflow-y:auto;
background:#0f131a;
}

.adminHeader{
position:sticky;
top:0;
z-index:5;
min-height:64px;
background:#191f29;
border-bottom:1px solid #2b3442;
display:flex;
align-items:center;
justify-content:space-between;
padding:9px 12px;
gap:8px;
}

.adminTitle{font-weight:bold;font-size:15px}

.adminActions{
display:flex;
gap:6px;
}

.deleteAll{
background:#d63842;
color:#fff;
border-radius:9px;
padding:9px 10px;
font-size:11px;
}

.adminList{
max-width:760px;
margin:auto;
padding:13px;
}

.adminItem{
background:#1b232e;
border:1px solid #2d3746;
border-radius:14px;
padding:11px;
margin-bottom:9px;
}

.adminTop{
display:flex;
justify-content:space-between;
gap:8px;
margin-bottom:6px;
}

.adminUser{
color:#72a6ff;
font-weight:bold;
font-size:13px;
}

.adminDate{
color:#818b99;
font-size:10px;
}

.adminText{
font-size:14px;
line-height:1.7;
word-break:break-word;
}

.deleteOne{
margin-top:9px;
background:#51262b;
color:#ff9ca7;
padding:8px 10px;
border-radius:8px;
font-size:11px;
}

.loading{
text-align:center;
color:#8791a0;
padding:30px 10px;
}

@media(max-width:360px){
.card{padding:20px 14px}
h1{font-size:22px}
.messageBubble{max-width:93%}
}
</style>
</head>

<body>

<div id="homeScreen" class="screen">
<div class="card">

<div class="logo">💬</div>
<h1>چت آنلاین</h1>
<div class="sub">برای ادامه یکی از گزینه‌ها را انتخاب کنید</div>

<button id="registerBtn" class="btn">ساخت حساب</button>
<button id="loginBtn" class="btn secondary">ورود به حساب</button>
<button id="adminBtn" class="btn admin">ورود ادمین 🔐</button>

<div id="homeNotice" class="notice"></div>

</div>
</div>

<div id="registerScreen" class="screen hidden">
<div class="card">

<div class="title">ساخت حساب</div>

<input id="registerUsername" class="input" type="text" maxlength="30" placeholder="نام کاربری">
<input id="registerPassword" class="input" type="password" placeholder="رمز عبور">

<button id="doRegister" class="btn">ساخت حساب</button>
<button id="registerBack" class="btn secondary">برگشت</button>

<div id="registerNotice" class="notice"></div>

</div>
</div>

<div id="loginScreen" class="screen hidden">
<div class="card">

<div class="title">ورود به حساب</div>

<input id="loginUsername" class="input" type="text" maxlength="30" placeholder="نام کاربری">
<input id="loginPassword" class="input" type="password" placeholder="رمز عبور">

<button id="doLogin" class="btn">ورود</button>
<button id="loginBack" class="btn secondary">برگشت</button>

<div id="loginNotice" class="notice"></div>

</div>
</div>

<div id="adminLoginScreen" class="screen hidden">
<div class="card">

<div class="title">ورود ادمین 🔐</div>

<input id="adminUsername" class="input" type="text" placeholder="نام کاربری ادمین">
<input id="adminPassword" class="input" type="password" placeholder="رمز عبور ادمین">

<button id="doAdminLogin" class="btn admin">ورود ادمین</button>
<button id="adminBack" class="btn secondary">برگشت</button>

<div id="adminNotice" class="notice"></div>

</div>
</div>

<div id="chatScreen" class="hidden">

<div class="header">

<div>
<div class="headerTitle">💬 چت آنلاین</div>
<div class="status">● آنلاین</div>
</div>

<button id="logoutBtn" class="smallBtn">خروج</button>

</div>

<div id="messages" class="messages">
<div class="loading">در حال دریافت پیام‌ها...</div>
</div>

<div class="inputArea">
<input id="chatInput" class="chatInput" type="text" maxlength="1000" placeholder="پیامت را بنویس...">
<button id="sendBtn" class="send">➤</button>
</div>

</div>

<div id="adminScreen" class="hidden">

<div class="adminHeader">

<div class="adminTitle">🔐 پنل مدیریت چت</div>

<div class="adminActions">
<button id="deleteAllBtn" class="deleteAll">حذف همه</button>
<button id="adminLogoutBtn" class="smallBtn">خروج</button>
</div>

</div>

<div id="adminList" class="adminList">
<div class="loading">در حال دریافت پیام‌ها...</div>
</div>

</div>

<script>

const SUPABASE_URL =
"https://phhdtmgubuwqoagjemjt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_tSAcYUIqP0OOE4vKscbKwA_MW8ExoLg";

let supabaseClient=null;

let currentUsername=
localStorage.getItem("chat_username")||"";

let adminToken=
sessionStorage.getItem("admin_token")||"";

let chatChannel=null;
let adminChannel=null;

function showNotice(id,text,type="error"){

const el=document.getElementById(id);

if(!el)return;

el.textContent=text;
el.className="notice show "+type;

}

function clearNotice(id){

const el=document.getElementById(id);

if(!el)return;

el.textContent="";
el.className="notice";

}

const screens=[
"homeScreen",
"registerScreen",
"loginScreen",
"adminLoginScreen",
"chatScreen",
"adminScreen"
];

function hideScreens(){

screens.forEach(id=>{

const el=document.getElementById(id);

if(el)el.classList.add("hidden");

});

}

function showScreen(id){

hideScreens();

const el=document.getElementById(id);

if(el)el.classList.remove("hidden");

}

function initialize(){

try{

if(
typeof window.supabase==="undefined" ||
typeof window.supabase.createClient!=="function"
){

throw new Error("Supabase library not loaded");

}

supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

return true;

}catch(error){

console.error(error);

showNotice(
"homeNotice",
"اتصال به سرویس چت برقرار نشد. صفحه را رفرش کن."
);

return false;

}

}

async function registerUser(){

const username=
document.getElementById("registerUsername").value.trim();

const password=
document.getElementById("registerPassword").value;

if(username.length<2){

showNotice(
"registerNotice",
"نام کاربری باید حداقل ۲ حرف باشد."
);

return;

}

if(password.length<4){

showNotice(
"registerNotice",
"رمز عبور باید حداقل ۴ کاراکتر باشد."
);

return;

}

showNotice(
"registerNotice",
"در حال ساخت حساب...",
"ok"
);

try{

const {data,error}=
await supabaseClient.rpc(
"register_chat_user",
{
p_username:username,
p_password:password
}
);

if(error){

console.error(error);

showNotice(
"registerNotice",
"خطا: "+error.message
);

return;

}

if(data&&data.success){

currentUsername=data.username;

localStorage.setItem(
"chat_username",
currentUsername
);

showNotice(
"registerNotice",
"حساب با موفقیت ساخته شد.",
"ok"
);

setTimeout(openChat,600);

}else{

showNotice(
"registerNotice",
data?.error||"ساخت حساب ناموفق بود."
);

}

}catch(error){

console.error(error);

showNotice(
"registerNotice",
"خطای اتصال به سرور."
);

}

}

async function loginUser(){

const username=
document.getElementById("loginUsername").value.trim();

const password=
document.getElementById("loginPassword").value;

if(!username||!password){

showNotice(
"loginNotice",
"نام کاربری و رمز عبور را وارد کن."
);

return;

}

showNotice(
"loginNotice",
"در حال ورود...",
"ok"
);

try{

const {data,error}=
await supabaseClient.rpc(
"login_chat_user",
{
p_username:username,
p_password:password
}
);

if(error){

console.error(error);

showNotice(
"loginNotice",
"خطا: "+error.message
);

return;

}

if(data&&data.success){

currentUsername=data.username;

localStorage.setItem(
"chat_username",
currentUsername
);

openChat();

}else{

showNotice(
"loginNotice",
data?.error||
"نام کاربری یا رمز عبور اشتباه است."
);

}

}catch(error){

console.error(error);

showNotice(
"loginNotice",
"خطای اتصال به سرور."
);

}

}

async function adminLogin(){

const username=
document.getElementById("adminUsername").value.trim();

const password=
document.getElementById("adminPassword").value;

if(!username||!password){

showNotice(
"adminNotice",
"نام کاربری و رمز عبور را وارد کن."
);

return;

}

showNotice(
"adminNotice",
"در حال ورود...",
"ok"
);

try{

const {data,error}=
await supabaseClient.rpc(
"admin_login",
{
p_username:username,
p_password:password
}
);

if(error){

console.error(error);

showNotice(
"adminNotice",
"خطا: "+error.message
);

return;

}

if(data&&data.success){

adminToken=data.token;

sessionStorage.setItem(
"admin_token",
adminToken
);

openAdmin();

}else{

showNotice(
"adminNotice",
data?.error||
"اطلاعات ادمین اشتباه است."
);

}

}catch(error){

console.error(error);

showNotice(
"adminNotice",
"خطای اتصال به سرور."
);

}

}

async function openChat(){

if(!currentUsername){

showScreen("homeScreen");
return;

}

showScreen("chatScreen");

await cleanupOldMessages();
await loadMessages();

startChatRealtime();

document.getElementById("chatInput").focus();

}

async function cleanupOldMessages(){

try{

await supabaseClient.rpc(
"cleanup_old_chat_messages"
);

}catch(error){

console.warn(error);

}

}

async function loadMessages(){

const box=
document.getElementById("messages");

box.innerHTML=
'<div class="loading">در حال دریافت پیام‌ها...</div>';

try{

const {data,error}=
await supabaseClient
.from("messages")
.select("*")
.order(
"created_at",
{ascending:true}
)
.limit(20);

if(error){

console.error(error);

box.innerHTML=
'<div class="loading">خطا در دریافت پیام‌ها</div>';

return;

}

renderMessages(data||[]);

}catch(error){

console.error(error);

box.innerHTML=
'<div class="loading">خطا در اتصال به سرور</div>';

}

}

function renderMessages(list){

const box=
document.getElementById("messages");

box.innerHTML="";

if(!list.length){

box.innerHTML=
'<div class="empty">هنوز پیامی ارسال نشده است 💬</div>';

return;

}

list.forEach(msg=>{

const item=
document.createElement("div");

item.className=
"messageBubble"+
(msg.username===currentUsername?" mine":"");

const user=
document.createElement("div");

user.className="user";
user.textContent=msg.username;

const text=
document.createElement("div");

text.className="messageText";
text.textContent=msg.message;

const time=
document.createElement("div");

time.className="time";
time.textContent=formatDate(msg.created_at);

item.appendChild(user);
item.appendChild(text);
item.appendChild(time);

box.appendChild(item);

});

box.scrollTop=box.scrollHeight;

}

async function sendMessage(){

if(!currentUsername)return;

const input=
document.getElementById("chatInput");

const message=
input.value.trim();

if(!message)return;

input.disabled=true;

try{

const {error}=
await supabaseClient
.from("messages")
.insert({
username:currentUsername,
message:message
});

if(error){

console.error(error);

alert(
"پیام ارسال نشد:\n"+error.message
);

return;

}

input.value="";

}catch(error){

console.error(error);

alert("خطا در ارسال پیام.");

}finally{

input.disabled=false;
input.focus();

}

}

function startChatRealtime(){

if(chatChannel){

supabaseClient.removeChannel(
chatChannel
);

}

chatChannel=
supabaseClient
.channel("online-chat")
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"messages"
},
()=>loadMessages()
)
.subscribe();

}

async function openAdmin(){

if(!adminToken){

showScreen("adminLoginScreen");
return;

}

showScreen("adminScreen");

await loadAdminMessages();

startAdminRealtime();

}

async function loadAdminMessages(){

const box=
document.getElementById("adminList");

box.innerHTML=
'<div class="loading">در حال دریافت پیام‌ها...</div>';

try{

const {data,error}=
await supabaseClient
.from("messages")
.select("*")
.order(
"created_at",
{ascending:false}
)
.limit(20);

if(error){

console.error(error);

box.innerHTML=
'<div class="loading">خطا در دریافت پیام‌ها</div>';

return;

}

box.innerHTML="";

if(!data.length){

box.innerHTML=
'<div class="loading">هیچ پیامی وجود ندارد.</div>';

return;

}

data.forEach(msg=>{

const item=
document.createElement("div");

item.className="adminItem";

const top=
document.createElement("div");

top.className="adminTop";

const user=
document.createElement("div");

user.className="adminUser";
user.textContent=msg.username;

const date=
document.createElement("div");

date.className="adminDate";
date.textContent=formatDate(msg.created_at);

top.appendChild(user);
top.appendChild(date);

const text=
document.createElement("div");

text.className="adminText";
text.textContent=msg.message;

const del=
document.createElement("button");

del.className="deleteOne";
del.textContent="🗑 حذف پیام";

del.addEventListener(
"click",
()=>deleteOneMessage(msg.id)
);

item.appendChild(top);
item.appendChild(text);
item.appendChild(del);

box.appendChild(item);

});

}catch(error){

console.error(error);

box.innerHTML=
'<div class="loading">خطای غیرمنتظره</div>';

}

}

async function deleteOneMessage(id){

if(!adminToken){

alert("دسترسی ادمین معتبر نیست.");
return;

}

if(!confirm("این پیام برای همه حذف شود؟"))return;

try{

const {data,error}=
await supabaseClient.rpc(
"admin_delete_message",
{
p_token:adminToken,
p_message_id:id
}
);

if(error){

console.error(error);

alert(
"خطا در حذف:\n"+error.message
);

return;

}

if(data&&data.success){

loadAdminMessages();

}else{

alert(
data?.error||
"حذف پیام انجام نشد."
);

}

}catch(error){

console.error(error);

alert("خطا در حذف پیام.");

}

}

async function deleteAllMessages(){

if(!adminToken){

alert("دسترسی ادمین معتبر نیست.");
return;

}

if(!confirm(
"⚠️ مطمئنی می‌خواهی تمام پیام‌ها حذف شوند؟"
))return;

try{

const {data,error}=
await supabaseClient.rpc(
"admin_delete_all_messages",
{
p_token:adminToken
}
);

if(error){

console.error(error);

alert(
"خطا در حذف:\n"+error.message
);

return;

}

if(data&&data.success){

loadAdminMessages();

}else{

alert(
data?.error||
"حذف همه پیام‌ها انجام نشد."
);

}

}catch(error){

console.error(error);

alert("خطا در حذف همه پیام‌ها.");

}

}

function startAdminRealtime(){

if(adminChannel){

supabaseClient.removeChannel(
adminChannel
);

}

adminChannel=
supabaseClient
.channel("admin-chat")
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"messages"
},
()=>loadAdminMessages()
)
.subscribe();

}

function logoutUser(){

currentUsername="";

localStorage.removeItem(
"chat_username"
);

if(chatChannel){

supabaseClient.removeChannel(
chatChannel
);

chatChannel=null;

}

showScreen("homeScreen");

}

function logoutAdmin(){

adminToken="";

sessionStorage.removeItem(
"admin_token"
);

if(adminChannel){

supabaseClient.removeChannel(
adminChannel
);

adminChannel=null;

}

showScreen("homeScreen");

}

function formatDate(value){

try{

return new Date(value).toLocaleString(
"fa-IR",
{
hour:"2-digit",
minute:"2-digit",
year:"numeric",
month:"2-digit",
day:"2-digit"
}
);

}catch(e){

return "";

}

}

/* BUTTONS */

document.getElementById("registerBtn").addEventListener(
"click",
()=>{
clearNotice("registerNotice");
showScreen("registerScreen");
}
);

document.getElementById("loginBtn").addEventListener(
"click",
()=>{
clearNotice("loginNotice");
showScreen("loginScreen");
}
);

document.getElementById("adminBtn").addEventListener(
"click",
()=>{
clearNotice("adminNotice");
showScreen("adminLoginScreen");
}
);

document.getElementById("registerBack").addEventListener(
"click",
()=>showScreen("homeScreen")
);

document.getElementById("loginBack").addEventListener(
"click",
()=>showScreen("homeScreen")
);

document.getElementById("adminBack").addEventListener(
"click",
()=>showScreen("homeScreen")
);

document.getElementById("doRegister").addEventListener(
"click",
registerUser
);

document.getElementById("doLogin").addEventListener(
"click",
loginUser
);

document.getElementById("doAdminLogin").addEventListener(
"click",
adminLogin
);

document.getElementById("sendBtn").addEventListener(
"click",
sendMessage
);

document.getElementById("logoutBtn").addEventListener(
"click",
logoutUser
);

document.getElementById("adminLogoutBtn").addEventListener(
"click",
logoutAdmin
);

document.getElementById("deleteAllBtn").addEventListener(
"click",
deleteAllMessages
);

/* ENTER */

document.getElementById("registerPassword").addEventListener(
"keydown",
e=>{
if(e.key==="Enter")registerUser();
}
);

document.getElementById("loginPassword").addEventListener(
"keydown",
e=>{
if(e.key==="Enter")loginUser();
}
);

document.getElementById("adminPassword").addEventListener(
