<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://phhdtmgubuwqoagjemjt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_tSAcYUIqP0OOE4vKscbKwA_MW8ExoLg";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

/* =====================================================
ADMIN
===================================================== */

const ADMIN_USERNAME = "logic";
const ADMIN_PASSWORD = "Alikardan";

let isAdmin = false;
let currentUser = null;
let chatIsOpen = true;

/* =====================================================
ELEMENTS
===================================================== */

const loginScreen =
document.getElementById("loginScreen");

const registerScreen =
document.getElementById("registerScreen");

const adminLogin =
document.getElementById("adminLogin");

const loginUsername =
document.getElementById("loginUsername");

const loginPassword =
document.getElementById("loginPassword");

const registerUsername =
document.getElementById("registerUsername");

const registerPassword =
document.getElementById("registerPassword");

const registerPassword2 =
document.getElementById("registerPassword2");

const loginError =
document.getElementById("loginError");

const registerError =
document.getElementById("registerError");

const adminError =
document.getElementById("adminError");

const messagesBox =
document.getElementById("messages");

const messageForm =
document.getElementById("messageForm");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const status =
document.getElementById("status");

const closedBanner =
document.getElementById("closedBanner");

const adminBtn =
document.getElementById("adminBtn");

const adminPanel =
document.getElementById("adminPanel");

const usersList =
document.getElementById("usersList");

/* =====================================================
SHA-256
===================================================== */

async function hashPassword(password){

const encoder =
new TextEncoder();

const data =
encoder.encode(password);

const hash =
await crypto.subtle.digest(
"SHA-256",
data
);

return Array
.from(new Uint8Array(hash))
.map(
b => b
.toString(16)
.padStart(2,"0")
)
.join("");

}

/* =====================================================
SHOW LOGIN
===================================================== */

function showLogin(){

loginScreen.style.display =
"flex";

registerScreen.style.display =
"none";

adminLogin.style.display =
"none";

}

/* =====================================================
REGISTER SCREEN
===================================================== */

document
.getElementById("registerBtn")
.onclick =
function(){

loginScreen.style.display =
"none";

registerScreen.style.display =
"flex";

registerUsername.focus();

};

/* =====================================================
BACK LOGIN
===================================================== */

document
.getElementById("backLoginBtn")
.onclick =
function(){

showLogin();

};

/* =====================================================
REGISTER
===================================================== */

document
.getElementById("createAccountBtn")
.onclick =
async function(){

registerError.textContent = "";

const username =
registerUsername.value.trim();

const password =
registerPassword.value;

const password2 =
registerPassword2.value;

if(username.length < 2){

registerError.textContent =
"نام کاربری باید حداقل ۲ حرف باشد.";

return;

}

if(password.length < 4){

registerError.textContent =
"رمز عبور باید حداقل ۴ کاراکتر باشد.";

return;

}

if(password !== password2){

registerError.textContent =
"رمز عبور و تکرار رمز یکسان نیست.";

return;

}

const passwordHash =
await hashPassword(password);

const result =
await db
.from("chat_users")
.insert({
username:username,
password_hash:passwordHash
})
.select("id,username,banned_until")
.single();

if(result.error){

if(
result.error.code === "23505"
){

registerError.textContent =
"❌ این نام کاربری قبلاً ثبت شده است.";

}else{

console.error(result.error);

registerError.textContent =
"❌ ثبت نام انجام نشد.";

}

return;

}

currentUser =
result.data;

localStorage.setItem(
"chat_username",
username
);

registerUsername.value = "";
registerPassword.value = "";
registerPassword2.value = "";

loginScreen.style.display =
"none";

registerScreen.style.display =
"none";

messageInput.focus();

};

/* =====================================================
LOGIN
===================================================== */

document
.getElementById("loginBtn")
.onclick =
async function(){

loginError.textContent = "";

const username =
loginUsername.value.trim();

const password =
loginPassword.value;

if(!username || !password){

loginError.textContent =
"نام کاربری و رمز عبور را وارد کن.";

return;

}

const passwordHash =
await hashPassword(password);

const result =
await db
.from("chat_users")
.select(
"id,username,password_hash,banned_until"
)
.eq(
"username",
username
)
.maybeSingle();

if(result.error){

console.error(result.error);

loginError.textContent =
"خطا در اتصال به سرور.";

return;

}

if(!result.data){

loginError.textContent =
"❌ این حساب وجود ندارد. ابتدا ثبت نام کن.";

return;

}

if(
result.data.password_hash !==
passwordHash
){

loginError.textContent =
"❌ نام کاربری یا رمز عبور اشتباه است.";

return;

}

if(result.data.banned_until){

const bannedUntil =
new Date(
result.data.banned_until
);

const now =
new Date();

if(bannedUntil > now){

const minutes =
Math.ceil(
(bannedUntil - now) /
60000
);

loginError.textContent =
"🚫 دسترسی شما مسدود است. " +
"حدود " +
minutes +
" دقیقه باقی مانده.";

return;

}

}

currentUser =
result.data;

localStorage.setItem(
"chat_username",
username
);

loginUsername.value = "";
loginPassword.value = "";

loginScreen.style.display =
"none";

messageInput.focus();

};

/* =====================================================
ADMIN LOGIN
===================================================== */

document
.getElementById("adminEntry")
.onclick =
function(){

loginScreen.style.display =
"none";

adminLogin.style.display =
"flex";

};

document
.getElementById("backFromAdmin")
.onclick =
function(){

showLogin();

};

document
.getElementById("adminLoginBtn")
.onclick =
function(){

const username =
document
.getElementById("adminUsername")
.value
.trim();

const password =
document
.getElementById("adminPassword")
.value;

if(
username === ADMIN_USERNAME &&
password === ADMIN_PASSWORD
){

isAdmin = true;

adminLogin.style.display =
"none";

loginScreen.style.display =
"none";

adminBtn.style.display =
"block";

loadUsers();

messageInput.focus();

}else{

adminError.textContent =
"نام کاربری یا رمز عبور اشتباه است.";

}

};

/* =====================================================
FORMAT TIME
===================================================== */

function formatTime(date){

return new Date(date)
.toLocaleTimeString(
"fa-IR",
{
hour:"2-digit",
minute:"2-digit"
}
);

}

/* =====================================================
ADD MESSAGE
===================================================== */

function addMessage(message){

if(
!message ||
!message.id
){
return;
}

if(
document.querySelector(
'[data-message-id="' +
message.id +
'"]'
)
){

return;

}

const empty =
document.getElementById("empty");

if(empty){
empty.remove();
}

const box =
document.createElement("div");

box.className =
"message";

box.dataset.messageId =
message.id;

if(
currentUser &&
message.username ===
currentUser.username &&
!isAdmin
){

box.classList.add("mine");

}else{

box.classList.add("other");

}

const user =
document.createElement("div");

user.className =
"username";

user.textContent =
message.username;

const text =
document.createElement("div");

text.className =
"text";

text.textContent =
message.message;

const time =
document.createElement("div");

time.className =
"time";

time.textContent =
formatTime(
message.created_at
);

box.appendChild(user);
box.appendChild(text);
box.appendChild(time);

if(isAdmin){

const actions =
document.createElement("div");

actions.className =
"message-actions";

const deleteBtn =
document.createElement("button");

deleteBtn.className =
"delete-message";

deleteBtn.textContent =
"🗑️ حذف پیام";

deleteBtn.onclick =
function(){

deleteMessage(
message.id
);

};

actions.appendChild(
deleteBtn
);

box.appendChild(
actions
);

}

messagesBox.appendChild(
box
);

messagesBox.scrollTop =
messagesBox.scrollHeight;

}

/* =====================================================
LOAD MESSAGES
===================================================== */

async function loadMessages(){

const result =
await db
.from("messages")
.select(
"id,username,message,created_at"
)
.order(
"created_at",
{
ascending:true
}
)
.limit(10);

if(result.error){

console.error(result.error);

status.textContent =
"🔴 خطای اتصال";

return;

}

result.data.forEach(
addMessage
);

status.textContent =
"🟢 آنلاین";

}

/* =====================================================
DELETE ONE MESSAGE
===================================================== */

async function deleteMessage(id){

if(!isAdmin){
return;
}

if(
!confirm(
"آیا از حذف این پیام مطمئنی؟"
)
){

return;

}

const result =
await db
.from("messages")
.delete()
.eq("id",id);

if(result.error){

console.error(result.error);

alert(
"❌ حذف پیام انجام نشد."
);

return;

}

removeMessageFromScreen(
id
);

}

/* =====================================================
REMOVE MESSAGE UI
===================================================== */

function removeMessageFromScreen(id){

const element =
document.querySelector(
'[data-message-id="' +
id +
'"]'
);

if(element){
element.remove();
}

checkEmpty();

}

/* =====================================================
EMPTY
===================================================== */

function checkEmpty(){

const messages =
document.querySelectorAll(
".message"
);

if(messages.length === 0){

if(
!document.getElementById("empty")
){

messagesBox.innerHTML = &lt;div id="empty" class="empty"&gt; هنوز پیامی ارسال نشده 👋 &lt;/div&gt;;

}

}

}

/* =====================================================
SEND MESSAGE
===================================================== */

messageForm.onsubmit =
async function(event){

event.preventDefault();

if(
!currentUser &&
!isAdmin
){

showLogin();

return;

}

if(!chatIsOpen && !isAdmin){

alert(
"🔴 چت در حال حاضر بسته است."
);

return;

}

const text =
messageInput.value.trim();

if(!text){
return;
}

messageInput.disabled =
true;

sendBtn.disabled =
true;

const sender =
isAdmin
? "مدیر"
: currentUser.username;

const result =
await db
.from("messages")
.insert({

username:sender,
message:text

});

if(result.error){

console.error(result.error);

alert(
"❌ پیام ارسال نشد."
);

}else{

messageInput.value = "";

}

messageInput.disabled =
false;

sendBtn.disabled =
false;

messageInput.focus();

};

/* =====================================================
CHAT SETTINGS
===================================================== */

async function loadChatSettings(){

const result =
await db
.from("chat_settings")
.select("chat_open")
.eq("id",1)
.single();

if(result.error){

console.error(result.error);

return;

}

setChatState(
result.data.chat_open
);

}

/* =====================================================
CHAT STATE
===================================================== */

function setChatState(open){

chatIsOpen =
open;

if(open){

closedBanner.style.display =
"none";

messageInput.disabled =
false;

sendBtn.disabled =
false;

messageInput.placeholder =
"پیامت رو بنویس...";

}else{

closedBanner.style.display =
"block";

if(!isAdmin){

messageInput.disabled =
true;

sendBtn.disabled =
true;

messageInput.placeholder =
"چت بسته است";

}

}

}

/* =====================================================
CLOSE CHAT
===================================================== */

document
.getElementById("closeChatBtn")
.onclick =
async function(){

if(!isAdmin){
return;
}

const result =
await db
.from("chat_settings")
.update({
chat_open:false
})
.eq("id",1);

if(result.error){

console.error(result.error);

alert(
"❌ بستن چت انجام نشد."
);

return;

}

setChatState(false);

};

/* =====================================================
OPEN CHAT
===================================================== */

document
.getElementById("openChatBtn")
.onclick =
async function(){

if(!isAdmin){
return;
}

const result =
await db
.from("chat_settings")
.update({
chat_open:true
})
.eq("id",1);

if(result.error){

console.error(result.error);

alert(
"❌ باز کردن چت انجام نشد."
);

return;

}

setChatState(true);

};

/* =====================================================
DELETE ALL
===================================================== */

document
.getElementById("deleteAllBtn")
.onclick =
async function(){

if(!isAdmin){
return;
}

if(
!confirm(
"⚠️ تمام پیام‌های چت حذف می‌شوند.\n\nمطمئنی؟"
)
){

return;

}

const result =
await db
.from("messages")
.delete()
.not(
"id",
"is",
null
);

if(result.error){

console.error(result.error);

alert(
"❌ پاک کردن چت انجام نشد."
);

return;

}

messagesBox.innerHTML = &lt;div id="empty" class="empty"&gt; چت پاک شد 🧹 &lt;/div&gt;;

};

/* =====================================================
LOAD USERS
===================================================== */

async function loadUsers(){

if(!isAdmin){
return;
}

const result =
await db
.from("chat_users")
.select(
"id,username,banned_until"
)
.order(
"created_at",
{
ascending:false
}
);

if(result.error){

console.error(result.error);

usersList.textContent =
"خطا در دریافت کاربران.";

return;

}

if(!result.data.length){

usersList.textContent =
"هنوز کاربری ثبت نام نکرده.";

return;

}

usersList.innerHTML = "";

result.data.forEach(
user => {

const row =
document.createElement("div");

row.className =
"user-row";

const name =
document.createElement("span");

name.className =
"user-name";

name.textContent =
user.username;

const kick =
document.createElement("button");

kick.className =
"kick-btn";

kick.textContent =
"👢 اخراج ۱۰ دقیقه";

kick.onclick =
function(){

kickUser(
user.id,
user.username
);

};

row.appendChild(name);
row.appendChild(kick);

usersList.appendChild(row);

}
);

}

/* =====================================================
KICK USER
===================================================== */

async function kickUser(
userId,
username
){

if(!isAdmin){
return;
}

if(
!confirm(
"کاربر «" +
username +
"» برای ۱۰ دقیقه اخراج شود؟"
)
){

return;

}

const until =
new Date(
Date.now() +
10 * 60 * 1000
)
.toISOString();

const result =
await db
.from("chat_users")
.update({
banned_until:until
})
.eq(
"id",
userId
);

if(result.error){

console.error(result.error);

alert(
"❌ اخراج کاربر انجام نشد."
);

return;

}

alert(
"👢 " +
username +
" برای ۱۰ دقیقه اخراج شد."
);

loadUsers();

}

/* =====================================================
ADMIN PANEL
===================================================== */

adminBtn.onclick =
function(){

adminPanel.style.display =
"flex";

loadUsers();

};

document
.getElementById("adminClose")
.onclick =
function(){

adminPanel.style.display =
"none";

};

/* =====================================================
REALTIME
===================================================== */

db
.channel("chat-room")

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages"
},
function(payload){

addMessage(
payload.new
);

}
)

.on(
"postgres_changes",
{
event:"DELETE",
schema:"public",
table:"messages"
},
function(payload){

if(payload.old && payload.old.id){

removeMessageFromScreen(
payload.old.id
);

}

}
)

.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"chat_settings"
},
function(payload){

if(
payload.new &&
typeof payload.new.chat_open !==
"undefined"
){

setChatState(
payload.new.chat_open
);

}

}
)

.subscribe(
function(state){

if(
state === "SUBSCRIBED"
){

status.textContent =
"🟢 آنلاین";

}

}
);

/* =====================================================
START
===================================================== */

loadMessages();

loadChatSettings();

</script>

</body>
</html>
